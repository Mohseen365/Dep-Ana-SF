<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detached Investigation Window Spike</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #090d16;
      color: #f8fafc;
    }
    .card {
      background-color: #111827;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      margin-top: 12px;
    }
    .node-id-display {
      font-size: 18px;
      font-weight: bold;
      color: #38bdf8;
      margin-top: 8px;
      word-break: break-all;
    }
    .status-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      background-color: #064e3b;
      color: #6ee7b7;
    }
    .history-list {
      margin-top: 8px;
      padding-left: 20px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <h2>Detached Window Spike</h2>
  <p style="font-size: 13px; color: #94a3b8;">
    Connected via <code style="color: #38bdf8;">BroadcastChannel('explorer-detached-sync')</code>.
  </p>

  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span style="font-size: 12px; color: #94a3b8; text-transform: uppercase;">Selected Node</span>
      <span class="status-pill" id="status-pill">CONNECTED</span>
    </div>
    <div class="node-id-display" id="node-id-display">None selected</div>
  </div>

  <div class="card">
    <h4 style="margin: 0;">Selection History</h4>
    <ul class="history-list" id="history-list">
      <li>Waiting for broadcast events...</li>
    </ul>
  </div>

  <script type="module" src="./detached-window.ts"></script>
</body>
</html>
