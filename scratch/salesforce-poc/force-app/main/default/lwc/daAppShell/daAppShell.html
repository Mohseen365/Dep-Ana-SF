<template>
    <div class="shell-host slds-scope" onfilterchange={handleFilterChange} oncontainerchange={handleContainerChange} onviewchange={handleViewChange}>
        <!-- Modular Header Component (TASK-P1-03) -->
        <c-da-header
            project-id={activeProjectId}
            project-key={activeProjectKey}
            active-view={activeViewMode}
            selected-node-id={selectedNodeId}
            is-loading={isLoadingGraph}
            error={graphError}
            onprojectchange={handleProjectChange}
            onactiontrigger={handleHeaderActionTrigger}
            onglobalsearch={handleHeaderGlobalSearch}>
        </c-da-header>

        <!-- View Navigation Tab Bar (FEAT-SHELL-01) -->
        <div class="slds-tabs_default shell-tabs">
            <ul class="slds-tabs_default__nav" role="tablist">
                <li class={graphTabClass} title="Graph Viewer" role="presentation">
                    <a class="slds-tabs_default__link" href="javascript:void(0);" role="tab" tabindex={graphTabIndex} aria-selected={isGraphView} id="tab-graph__item" onclick={selectGraphView}>
                        Graph Viewer
                    </a>
                </li>
                <li class={matrixTabClass} title="Dependency Matrix" role="presentation">
                    <a class="slds-tabs_default__link" href="javascript:void(0);" role="tab" tabindex={matrixTabIndex} aria-selected={isMatrixView} id="tab-matrix__item" onclick={selectMatrixView}>
                        Dependency Matrix
                    </a>
                </li>
                <li class={findingsTabClass} title="Findings & Alerts" role="presentation">
                    <a class="slds-tabs_default__link" href="javascript:void(0);" role="tab" tabindex={findingsTabIndex} aria-selected={isFindingsView} id="tab-findings__item" onclick={selectFindingsView}>
                        Findings & Alerts
                    </a>
                </li>
            </ul>

            <!-- Workspace Body: Modular Sidebar (TASK-P1-04) + Main View Container -->
            <div class="slds-grid shell-workspace-grid">
                <!-- Architecture Inventory Sidebar -->
                <div class="slds-col_bump-left sidebar-wrapper">
                    <c-da-sidebar
                        project-id={activeProjectId}
                        selected-node-id={selectedNodeId}
                        nodes={activeGraphNodes}
                        onnodeselect={handleNodeSelect}
                        onlayerfilterchange={handleLayerFilterChange}>
                    </c-da-sidebar>
                </div>

                <!-- Active View Container -->
                <div class="shell-content-container slds-p-around_medium slds-col">
                    <!-- Graph View -->
                    <template if:true={isGraphView}>
                        <div id="tab-graph" class="slds-tabs_default__content slds-show" role="tabpanel" aria-labelledby="tab-graph__item">
                            <template if:true={activeProjectId}>
                                <div class="slds-grid slds-gutters">
                                    <div class="slds-col slds-size_2-of-3">
                                        <c-da-graph-viewer
                                            record-id={activeProjectId}
                                            filter-criteria={activeFilterCriteria}
                                            onnodeselect={handleNodeSelect}>
                                        </c-da-graph-viewer>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <c-da-annotation-panel
                                            project-id={activeProjectId}
                                            selected-node-id={selectedNodeId}>
                                        </c-da-annotation-panel>
                                    </div>
                                </div>
                            </template>
                            <template if:false={activeProjectId}>
                                <div class="slds-illustration slds-illustration_small empty-state-padding">
                                    <div class="slds-text-longform">
                                        <h3 class="slds-text-heading_medium">No Project Selected</h3>
                                        <p class="slds-text-body_regular">Please select a project from the header to display its dependency graph.</p>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- Matrix View -->
                    <template if:true={isMatrixView}>
                        <div id="tab-matrix" class="slds-tabs_default__content slds-show" role="tabpanel" aria-labelledby="tab-matrix__item">
                            <template if:true={activeProjectId}>
                                <template if:true={isLoadingGraph}>
                                    <lightning-spinner alternative-text="Loading graph data for Dependency Matrix..." size="medium"></lightning-spinner>
                                </template>
                                <template if:true={graphError}>
                                    <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                                        <h2>{graphError}</h2>
                                    </div>
                                </template>
                                <template if:false={isLoadingGraph}>
                                    <template if:false={graphError}>
                                        <c-da-matrix-view
                                            project-id={activeProjectId}
                                            graph-payload={activeGraphPayload}
                                            filter-criteria={activeFilterCriteria}>
                                        </c-da-matrix-view>
                                    </template>
                                </template>
                            </template>
                            <template if:false={activeProjectId}>
                                <div class="slds-illustration slds-illustration_small empty-state-padding">
                                    <div class="slds-text-longform">
                                        <h3 class="slds-text-heading_medium">No Project Selected</h3>
                                        <p class="slds-text-body_regular">Please select a project from the header to display its dependency matrix.</p>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- Findings View -->
                    <template if:true={isFindingsView}>
                        <div id="tab-findings" class="slds-tabs_default__content slds-show" role="tabpanel" aria-labelledby="tab-findings__item">
                            <template if:true={activeProjectId}>
                                <template if:true={isLoadingGraph}>
                                    <lightning-spinner alternative-text="Loading graph data for Findings & Alerts..." size="medium"></lightning-spinner>
                                </template>
                                <template if:true={graphError}>
                                    <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                                        <h2>{graphError}</h2>
                                    </div>
                                </template>
                                <template if:false={isLoadingGraph}>
                                    <template if:false={graphError}>
                                        <c-da-findings-view
                                            project-id={activeProjectId}
                                            graph-payload={activeGraphPayload}
                                            filter-criteria={activeFilterCriteria}>
                                        </c-da-findings-view>
                                    </template>
                                </template>
                            </template>
                            <template if:false={activeProjectId}>
                                <div class="slds-illustration slds-illustration_small empty-state-padding">
                                    <div class="slds-text-longform">
                                        <h3 class="slds-text-heading_medium">No Project Selected</h3>
                                        <p class="slds-text-body_regular">Please select a project from the header to display its findings and architectural alerts.</p>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>
</template>
