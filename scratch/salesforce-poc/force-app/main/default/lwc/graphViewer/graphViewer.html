<template>
    <lightning-card title="Salesforce Architecture Explorer — Cytoscape LWS PoC" icon-name="custom:custom19">
        <div class="slds-p-around_medium">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading Graph..." size="medium"></lightning-spinner>
            </template>
            <template if:true={errorMessage}>
                <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
                    <h2>{errorMessage}</h2>
                </div>
            </template>
            <div class="controls slds-m-bottom_small">
                <lightning-button label="Reset View" onclick={handleResetView} class="slds-m-right_x-small"></lightning-button>
                <lightning-button label="Run Layout" variant="brand" onclick={handleRunLayout}></lightning-button>
            </div>
            <div class="graph-container" lwc:dom="manual" style="height: 500px; width: 100%; border: 1px solid #dddbda; border-radius: 4px;"></div>
        </div>
    </lightning-card>
</template>
