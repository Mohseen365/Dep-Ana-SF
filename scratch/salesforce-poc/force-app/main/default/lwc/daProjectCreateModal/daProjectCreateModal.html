<template>
    <template if:true={isOpen}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="modal-heading-01"
            class="slds-modal slds-fade-in-open slds-modal_medium">
            <div class="slds-modal__container">
                <!-- Header -->
                <header class="slds-modal__header">
                    <button
                        class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close"
                        onclick={close}
                        disabled={isImporting}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">
                        Create Project &amp; Import Graph
                    </h2>
                    <p class="slds-m-top_x-small slds-text-color_weak">
                        Register a new Salesforce project and optionally import its dependency architecture graph.
                    </p>
                </header>

                <!-- Body -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <template if:true={error}>
                        <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium" role="alert">
                            <span class="slds-assistive-text">Error</span>
                            <span class="slds-text-body_regular">{error}</span>
                        </div>
                    </template>

                    <div class="slds-form slds-form_stacked">
                        <!-- Project Name -->
                        <div class="slds-form-element slds-m-bottom_small">
                            <label class="slds-form-element__label" for="proj-name">
                                <abbr class="slds-required" title="required">* </abbr>Project Name
                            </label>
                            <div class="slds-form-element__control">
                                <input
                                    type="text"
                                    id="proj-name"
                                    class="slds-input"
                                    placeholder="e.g. Core CRM Services"
                                    value={projectName}
                                    oninput={handleNameChange}
                                    disabled={isImporting} />
                            </div>
                        </div>

                        <!-- Project Key / Slug -->
                        <div class="slds-form-element slds-m-bottom_small">
                            <label class="slds-form-element__label" for="proj-key">
                                <abbr class="slds-required" title="required">* </abbr>Project Key (Slug)
                            </label>
                            <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon_right">
                                <input
                                    type="text"
                                    id="proj-key"
                                    class="slds-input font-mono"
                                    placeholder="e.g. core-crm-services"
                                    value={projectKey}
                                    oninput={handleKeyChange}
                                    disabled={isImporting} />
                                <template if:true={isCheckingKey}>
                                    <span class="slds-icon slds-input__icon slds-input__icon_right slds-text-color_weak">
                                        Checking...
                                    </span>
                                </template>
                            </div>
                            <template if:true={projectKey}>
                                <div class="slds-m-top_xx-small slds-text-body_small">
                                    <template if:true={keyAvailable}>
                                        <span class="slds-text-color_success">✓ Key is available</span>
                                    </template>
                                    <template if:false={keyAvailable}>
                                        <span class="slds-text-color_error">✗ Key is already in use</span>
                                    </template>
                                </div>
                            </template>
                        </div>

                        <!-- Repository URL -->
                        <div class="slds-form-element slds-m-bottom_small">
                            <label class="slds-form-element__label" for="proj-repo">Repository URL</label>
                            <div class="slds-form-element__control">
                                <input
                                    type="url"
                                    id="proj-repo"
                                    class="slds-input"
                                    placeholder="https://github.com/org/salesforce-app"
                                    value={repositoryUrl}
                                    oninput={handleUrlChange}
                                    disabled={isImporting} />
                            </div>
                        </div>

                        <!-- Description -->
                        <div class="slds-form-element slds-m-bottom_small">
                            <label class="slds-form-element__label" for="proj-desc">Description</label>
                            <div class="slds-form-element__control">
                                <textarea
                                    id="proj-desc"
                                    class="slds-textarea"
                                    placeholder="Optional architectural description"
                                    oninput={handleDescriptionChange}
                                    disabled={isImporting}>{description}</textarea>
                            </div>
                        </div>

                        <!-- Dependency Graph File Upload -->
                        <div class="slds-form-element slds-m-bottom_small upload-section">
                            <label class="slds-form-element__label">Initial Dependency Graph (Optional)</label>
                            <div class="slds-form-element__control">
                                <div class="file-picker-box">
                                    <input
                                        type="file"
                                        id="manifest-file-input"
                                        accept=".json"
                                        onchange={handleFileChange}
                                        disabled={isImporting}
                                        class="slds-file-selector__input slds-assistive-text" />
                                    <label class="slds-file-selector__body" for="manifest-file-input">
                                        <span class="slds-file-selector__button slds-button slds-button_neutral">
                                            Choose JSON Graph
                                        </span>
                                        <span class="slds-file-selector__text slds-m-left_small">
                                            {selectedFileName}
                                        </span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- Progress Bar & Status -->
                        <template if:true={isImporting}>
                            <div class="slds-m-top_medium progress-container">
                                <div class="slds-grid slds-grid_align-spread slds-m-bottom_x-small">
                                    <span class="slds-text-body_small font-semibold">{currentStepText}</span>
                                    <span class="slds-text-body_small">{uploadProgress}%</span>
                                </div>
                                <div class="slds-progress-bar slds-progress-bar_medium" aria-valuemin="0" aria-valuemax="100" aria-valuenow={uploadProgress} role="progressbar">
                                    <span class="slds-progress-bar__value" style={progressBarStyle}></span>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Footer -->
                <footer class="slds-modal__footer slds-grid slds-grid_align-spread">
                    <div>
                        <template if:true={error}>
                            <button
                                type="button"
                                class="slds-button slds-button_destructive-text"
                                onclick={handleRetry}>
                                Retry Upload
                            </button>
                        </template>
                    </div>
                    <div>
                        <button
                            type="button"
                            class="slds-button slds-button_neutral"
                            onclick={close}
                            disabled={isImporting}>
                            Cancel
                        </button>
                        <button
                            type="button"
                            class="slds-button slds-button_brand slds-m-left_x-small"
                            onclick={handleSaveAndImport}
                            disabled={isImportDisabled}>
                            <template if:true={isImporting}>Creating &amp; Uploading...</template>
                            <template if:false={isImporting}>Create &amp; Open Project</template>
                        </button>
                    </div>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
