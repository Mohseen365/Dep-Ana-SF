<template>
    <div class="sankey-container" data-testid="sankey-container">
        <!-- Error State -->
        <template if:true={hasError}>
            <div class="error-banner" role="alert">
                <strong>Dependency River Error:</strong> {errorMessage}
            </div>
        </template>

        <!-- Empty State -->
        <template if:true={isEmpty}>
            <div class="state-container" data-testid="sankey-empty-state">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                </svg>
                <div class="state-title">No Dependency Flow Data Available</div>
                <div class="state-desc">Select a project with valid architectural nodes and dependency flows to view the Dependency River.</div>
            </div>
        </template>

        <!-- Main View when Data is Present -->
        <template if:true={hasData}>
            <!-- Toolbar -->
            <div class="sankey-toolbar" data-testid="sankey-toolbar">
                <div class="toolbar-left">
                    <div class="title-badge">
                        <h2>Dependency River</h2>
                        <span class="metric-pill">{summary.totalFlows} flows</span>
                        <span class="metric-pill">{summary.totalNodes} nodes</span>
                    </div>

                    <div class="toolbar-controls">
                        <input
                            type="search"
                            class="search-input"
                            placeholder="Filter nodes or features..."
                            value={searchQuery}
                            oninput={handleSearchChange}
                            aria-label="Filter nodes or features"
                        />

                        <select class="filter-select" onchange={handleLayerFilterChange} aria-label="Filter by layer stage">
                            <option value="">All Layers</option>
                            <template for:each={stageOptions} for:item="stage">
                                <option key={stage.layer} value={stage.layer}>{stage.label}</option>
                            </template>
                        </select>
                    </div>
                </div>

                <div class="toolbar-right">
                    <div class="summary-stats">
                        <span class="stat-item">Edges: <strong>{summary.totalEdgeWeight}</strong></span>
                        <span class="stat-item">Max Flow: <strong>{summary.maxFlowWeight}</strong></span>
                        <template if:true={summary.cyclicFlowCount}>
                            <span class="stat-item" style="color: #ef4444;">Cycles: <strong>{summary.cyclicFlowCount}</strong></span>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Workspace: SVG Canvas + Inspector Pane -->
            <div class="sankey-workspace">
                <!-- SVG Canvas Viewport -->
                <div class="sankey-canvas-wrapper" data-testid="sankey-canvas-wrapper">
                    <svg
                        class="sankey-svg"
                        width={canvasWidth}
                        height={canvasHeight}
                        viewBox={viewBoxString}
                        role="img"
                        aria-label="Dependency River Architectural Flow Diagram"
                    >
                        <defs>
                            <!-- Gradients for Stages -->
                            <linearGradient id="flowGradDefault" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
                                <stop offset="100%" stop-color="#818cf8" stop-opacity="0.45" />
                            </linearGradient>
                            <linearGradient id="flowGradCycle" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#ef4444" stop-opacity="0.6" />
                                <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.6" />
                            </linearGradient>
                        </defs>

                        <!-- Stage Columns & Background Guides -->
                        <g class="stage-columns-group">
                            <template for:each={renderedStages} for:item="stg">
                                <g key={stg.layer} class="stage-column">
                                    <rect
                                        class="stage-column-band"
                                        x={stg.x}
                                        y={stg.bandY}
                                        width={stg.width}
                                        height={stg.bandHeight}
                                        rx="4"
                                    />
                                    <text
                                        class="stage-header-title"
                                        x={stg.centerX}
                                        y={stg.headerY}
                                        text-anchor="middle"
                                    >
                                        {stg.label}
                                    </text>
                                    <text
                                        class="stage-header-subtitle"
                                        x={stg.centerX}
                                        y={stg.subHeaderY}
                                        text-anchor="middle"
                                    >
                                        {stg.nodeCount} components
                                    </text>
                                </g>
                            </template>
                        </g>

                        <!-- Flow Ribbons (Paths) -->
                        <g class="flow-ribbons-group">
                            <template for:each={renderedFlows} for:item="flw">
                                <path
                                    key={flw.id}
                                    class={flw.cssClass}
                                    d={flw.pathString}
                                    stroke={flw.strokeColor}
                                    stroke-width={flw.strokeWidth}
                                    stroke-opacity={flw.strokeOpacity}
                                    data-flow-id={flw.id}
                                    onclick={handleFlowClick}
                                    onmouseenter={handleFlowMouseEnter}
                                    onmouseleave={handleFlowMouseLeave}
                                    role="button"
                                    tabindex="0"
                                    aria-label={flw.ariaLabel}
                                />
                            </template>
                        </g>

                        <!-- Node Cards -->
                        <g class="node-cards-group">
                            <template for:each={renderedNodes} for:item="nd">
                                <g
                                    key={nd.id}
                                    class={nd.groupClass}
                                    transform={nd.transform}
                                    data-node-id={nd.id}
                                    onclick={handleNodeClick}
                                    onkeydown={handleNodeKeyDown}
                                    tabindex="0"
                                    role="button"
                                    aria-label={nd.ariaLabel}
                                >
                                    <!-- Background Card -->
                                    <rect
                                        class="node-card-bg"
                                        width={nd.width}
                                        height={nd.height}
                                    />

                                    <!-- Left Layer Indicator Bar -->
                                    <rect
                                        class="node-layer-indicator"
                                        x="4"
                                        y="4"
                                        width="4"
                                        height={nd.indicatorHeight}
                                        fill={nd.layerColor}
                                    />

                                    <!-- Label Title -->
                                    <text
                                        class="node-label-main"
                                        x="14"
                                        y="20"
                                    >
                                        {nd.displayLabel}
                                    </text>

                                    <!-- Subtitle Stats -->
                                    <text
                                        class="node-label-sub"
                                        x="14"
                                        y="34"
                                    >
                                        {nd.subStats}
                                    </text>
                                </g>
                            </template>
                        </g>
                    </svg>
                </div>

                <!-- Side Inspector Pane -->
                <div class="sankey-inspector" data-testid="sankey-inspector">
                    <!-- Flow Inspector Card -->
                    <template if:true={activeFlow}>
                        <div class="card-panel highlight" data-testid="flow-inspector-card">
                            <div class="inspector-section-header">Selected Flow Stream</div>
                            <div class="detail-title">{activeFlow.sourceLabel} ➔ {activeFlow.targetLabel}</div>
                            <div class="detail-subtitle">
                                <template if:true={activeFlow.isCycle}>
                                    <span style="color: #ef4444; font-weight: 700;">[CYCLIC / FEEDBACK] </span>
                                </template>
                                Flow Volume: <strong>{activeFlow.weight} edge(s)</strong>
                            </div>

                            <div class="metric-grid">
                                <div class="metric-box">
                                    <div class="metric-box-label">Source Stage</div>
                                    <div class="metric-box-value">{activeFlow.sourceStage}</div>
                                </div>
                                <div class="metric-box">
                                    <div class="metric-box-label">Target Stage</div>
                                    <div class="metric-box-value">{activeFlow.targetStage}</div>
                                </div>
                            </div>

                            <!-- Provenance Item List -->
                            <div class="inspector-section-header">Component Provenance ({activeFlow.provenance.length})</div>
                            <div class="provenance-scroll">
                                <template for:each={activeFlow.provenance} for:item="prov">
                                    <div key={prov.edgeId} class="provenance-item">
                                        <div class="provenance-edge">{prov.sourceComponentName} ➔ {prov.targetComponentName}</div>
                                        <template if:true={prov.evidence}>
                                            <div class="provenance-evidence">{prov.evidence}</div>
                                        </template>
                                    </div>
                                </template>
                            </div>

                            <button class="action-button" onclick={handleClearFlowSelection}>
                                Clear Flow Selection
                            </button>
                        </div>
                    </template>

                    <!-- Node Inspector Card -->
                    <template if:true={activeNode}>
                        <div class="card-panel" data-testid="node-inspector-card">
                            <div class="inspector-section-header">Selected Component</div>
                            <div class="detail-title">{activeNode.label}</div>
                            <div class="detail-subtitle">
                                Layer: <strong>{activeNode.layer}</strong> · Type: {activeNode.type}
                            </div>

                            <div class="metric-grid">
                                <div class="metric-box">
                                    <div class="metric-box-label">Inflow</div>
                                    <div class="metric-box-value">{activeNode.totalInflow}</div>
                                </div>
                                <div class="metric-box">
                                    <div class="metric-box-label">Outflow</div>
                                    <div class="metric-box-value">{activeNode.totalOutflow}</div>
                                </div>
                                <div class="metric-box">
                                    <div class="metric-box-label">Coupling</div>
                                    <div class="metric-box-value">{activeNode.coupling}</div>
                                </div>
                                <div class="metric-box">
                                    <div class="metric-box-label">Risk</div>
                                    <div class="metric-box-value" style={activeNode.riskStyle}>{activeNode.risk}</div>
                                </div>
                            </div>

                            <button class="action-button" onclick={handleInspectInInvestigationDrawer}>
                                Inspect In Drawer
                            </button>
                        </div>
                    </template>

                    <!-- Idle Prompt -->
                    <template if:false={hasSelection}>
                        <div class="empty-prompt">
                            Click any node card or flow ribbon to inspect dependency provenance and volume metrics.
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </div>
</template>
