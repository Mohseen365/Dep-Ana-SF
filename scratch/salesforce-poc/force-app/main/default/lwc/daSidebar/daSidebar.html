<template>
    <aside class={sidebarContainerClass}>
        <!-- Sidebar Collapse / Expand Header -->
        <div class="sidebar-header slds-grid slds-grid_align-spread slds-p-around_x-small slds-border_bottom">
            <template lwc:if={isCollapsed}>
                <lightning-button-icon
                    icon-name="utility:forward"
                    variant="border-filled"
                    alternative-text="Expand Sidebar"
                    title="Expand Sidebar"
                    onclick={handleSidebarCollapse}>
                </lightning-button-icon>
            </template>
            <template lwc:else>
                <div class="slds-grid slds-grid_vertical-align-center">
                    <lightning-icon icon-name="utility:side_list" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                    <span class="slds-text-title_caps slds-text-weight_bold">Architecture Inventory</span>
                </div>
                <lightning-button-icon
                    icon-name="utility:back"
                    variant="border-filled"
                    alternative-text="Collapse Sidebar"
                    title="Collapse Sidebar"
                    onclick={handleSidebarCollapse}>
                </lightning-button-icon>
            </template>
        </div>

        <!-- Expanded Sidebar Content -->
        <template lwc:if={isExpanded}>
            <div class="sidebar-body slds-p-around_x-small slds-scrollable_y">
                <!-- Quick Search Input -->
                <div class="slds-m-bottom_small">
                    <lightning-input
                        type="search"
                        label="Quick Filter"
                        variant="label-hidden"
                        placeholder="Filter components..."
                        value={searchFilter}
                        onchange={handleSearchChange}>
                    </lightning-input>
                </div>

                <!-- Architectural Layer Quick Filters -->
                <div class="slds-m-bottom_medium">
                    <div class="section-title slds-text-title_caps slds-m-bottom_xx-small">Architectural Layers</div>
                    <div class="slds-grid slds-wrap layer-badges">
                        <template for:each={layerFiltersList} for:item="layer">
                            <span
                                key={layer.name}
                                class={layer.badgeClass}
                                data-layer={layer.name}
                                onclick={handleQuickFilterToggle}>
                                {layer.name} ({layer.count})
                            </span>
                        </template>
                    </div>
                </div>

                <!-- Favorites Section -->
                <div class="slds-m-bottom_medium">
                    <div class="section-title slds-text-title_caps slds-m-bottom_xx-small">
                        <lightning-icon icon-name="utility:favorite" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                        Pinned Favorites ({favoriteNodesList.length})
                    </div>
                    <template lwc:if={hasFavorites}>
                        <ul class="slds-has-dividers_around-space slds-has-block-links_space">
                            <template for:each={favoriteNodesList} for:item="fav">
                                <li key={fav.id} class="slds-item favorite-item" data-id={fav.id} onclick={handleTreeNodeClick}>
                                    <div class="slds-grid slds-grid_align-spread">
                                        <span class="slds-truncate" title={fav.label}>{fav.label}</span>
                                        <span class="slds-badge slds-badge_lightest">{fav.type}</span>
                                    </div>
                                </li>
                            </template>
                        </ul>
                    </template>
                    <template lwc:else>
                        <p class="slds-text-body_small slds-text-color_weak slds-p-left_xx-small">No pinned items yet.</p>
                    </template>
                </div>

                <!-- Component Inventory Tree List -->
                <div>
                    <div class="section-title slds-text-title_caps slds-m-bottom_xx-small">
                        Components ({filteredInventory.length})
                    </div>
                    <template lwc:if={hasInventory}>
                        <ul class="slds-has-dividers_bottom slds-scrollable_y inventory-list">
                            <template for:each={filteredInventory} for:item="item">
                                <li
                                    key={item.id}
                                    class={item.itemClass}
                                    data-id={item.id}
                                    onclick={handleTreeNodeClick}>
                                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                        <div class="slds-truncate" title={item.label}>
                                            <lightning-icon icon-name={item.iconName} size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                            <span class="slds-text-body_regular">{item.label}</span>
                                        </div>
                                        <lightning-button-icon
                                            icon-name={item.starIcon}
                                            variant="bare"
                                            size="small"
                                            alternative-text="Toggle favorite"
                                            data-id={item.id}
                                            onclick={handleToggleFavorite}>
                                        </lightning-button-icon>
                                    </div>
                                    <div class="slds-text-color_weak slds-text-body_small item-meta">
                                        <span>{item.layer}</span> &bull; <span>{item.type}</span>
                                    </div>
                                </li>
                            </template>
                        </ul>
                    </template>
                    <template lwc:else>
                        <p class="slds-text-body_small slds-text-color_weak slds-p-around_small slds-text-align_center">
                            No components match current filter.
                        </p>
                    </template>
                </div>
            </div>
        </template>
    </aside>
</template>
